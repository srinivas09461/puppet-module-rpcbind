HOSTS:
  ubuntu-2404:
    roles:
      - agent
    platform: ubuntu-24.04-amd64
    hypervisor : docker
    image: ubuntu:24.04
    docker_preserve_image: true
    docker_cmd: '["/sbin/init"]'
    docker_image_commands:
      - 'apt-get install -y -q net-tools wget locales'
      - 'locale-gen en_US.UTF-8'
CONFIG:
  type: foss
  log_level: debug
ssh:
  password: root
  auth_methods: ["password"]

